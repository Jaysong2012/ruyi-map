</style></head><body>
<div id="map"></div><div id="grade"></div><div id="haze"></div>
<svg id="routes" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg>
<div id="title"></div><div id="legend"></div><div id="hud"><b></b><span></span></div><div id="credit"></div>
<script src="/lib/maplibre-gl.js"></script>
<script>
(async function(){
const C=await(await fetch('/compiled.json')).json();
const M=C.map,OUT=C.output,DUR=C.storyboard.durationSeconds,EVENTS=C.storyboard.events;
const LOCS={};for(const l of C.locations)LOCS[l.id]=l;
const SEGS={};for(const s of C.segments)SEGS[s.id]=s;
// 氛围调色：URL 参数 > map.grade > 默认（黄山暗调电影感判例：sat 原色亮绿直出=「死图」观感的一半；黄山同管线内建 sat/con/bmin/bmax 调色）
const Q=new URLSearchParams(location.search),qnum=(k,d)=>{const v=parseFloat(Q.get(k));return Number.isFinite(v)?v:d},qstr=(k,d)=>Q.get(k)||d;
const G0=M.grade||{};
const GRADE={sat:qnum('gsat',G0.sat??-.22),con:qnum('gcon',G0.con??.14),bmax:qnum('gmax',G0.bmax??.86),bmin:qnum('gmin',G0.bmin??0),vig:qnum('vig',G0.vig??.42),warm:qnum('warm',G0.warm??.5),hsx:qnum('hsx',G0.hsx??.5)};
// 大气 veil（2026-09-16 杠杆A·setSky 判死后的正解）：hz=强度 0 关（默认）建议 .5-.8；hzc=霾色；逐帧由 pitch（地平可见度）+zoom（海拔）驱动，高 pitch 低空=顶部远距霾最重——纯函数随 camAt，无帧历史依赖
const HAZE={k:qnum('hz',G0.hz??0),col:qstr('hzc',G0.hzc||'#d9e6f2')};
const hexA=(hex,a)=>{const m=/^#(..)(..)(..)$/.exec(hex);return m?`rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a.toFixed(3)})`:hex};
// 金色反向补偿（2026-09-16 修复 cfAlt 已知副作用）：hue-rotate 是 #map canvas 全局 CSS 滤镜，GL 烘焙金色（callout 标题/光圈/金点/徽章金边）会被带偏 +θ 成黄绿。
// 正解=烘焙与设色时预先 -θ 反向补偿：文字/图标按 θ 三档（h0/中/h1）烘备变体、__setT 逐帧就近切换（θ 随 zoom 连续变，变体离散=跳变 ≤6° 目检无感）；
// circle 层颜色（光圈/车头底座）setPaintProperty 逐帧精确补偿。goldfix=0 回退旧行为。DOM 层（HUD/图例/标题）不吃 canvas 滤镜，无需补偿。
const GOLDFIX=qnum('goldfix',G0.goldFix??1);
const hueRot=(hex,deg)=>{const m=/^#(..)(..)(..)$/.exec(hex);if(!m||!deg)return hex;let r=parseInt(m[1],16)/255,g=parseInt(m[2],16)/255,b=parseInt(m[3],16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  h=((h+deg)%360+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),mm=l-c/2;let rr=0,gg=0,bb=0;
  if(h<60){rr=c;gg=x}else if(h<120){rr=x;gg=c}else if(h<180){gg=c;bb=x}else if(h<240){gg=x;bb=c}else if(h<300){rr=x;bb=c}else{rr=c;bb=x}
  const to=v=>Math.round((v+mm)*255).toString(16).padStart(2,'0');return'#'+to(rr)+to(gg)+to(bb)};
// canvas 滤镜参数化（2026-09-16 青山绿水方向立项：旅游攻略地图贩卖向往=明亮通透青绿，黄山暗调非全局真理）；cf=CSS filter 串，默认保旧值；canvas 由 Map 构造生成，赋值必须在 map 创建后
const CF=qstr('cf',G0.cf||'saturate(1.04) contrast(1.03) brightness(.97)');
// 海拔自适应调色（2026-09-16 主人判例：高空荒凉山体全局染绿=假；谷底真植被染绿=还原夏天）：hue/sat 随 zoom 连续插值——高空看穿更厚大气色彩灰淡（真实航拍如此），低空近地饱和鲜活；cfalt=1 启用，逐帧纯函数零跳变
const CFALT={on:qnum('cfalt',G0.cfAlt??0),h0:qnum('cfhue0',G0.cfhue0??6),h1:qnum('cfhue1',G0.cfhue1??18),s0:qnum('cfsat0',G0.cfsat0??1.18),s1:qnum('cfsat1',G0.cfsat1??1.5),z0:qnum('cfz0',G0.cfz0??11.2),z1:qnum('cfz1',G0.cfz1??12.8),con:qnum('cfcon',G0.cfcon??1.04),bri:qnum('cfbri',G0.cfbri??1.06)};
// 金色补偿变体档（见 hexA 下 goldfix 注释）：CFALT 关=单档零行为变化
const GOLDTH=CFALT.on&&GOLDFIX?[CFALT.h0,(CFALT.h0+CFALT.h1)/2,CFALT.h1]:[0];
const goldVi=h=>GOLDTH.length<2?0:(h<=(GOLDTH[0]+GOLDTH[1])/2?0:h>=(GOLDTH[1]+GOLDTH[2])/2?2:1);
{const g=document.querySelector('#grade');g.style.boxShadow=`inset 0 0 ${Math.round(100+GRADE.vig*260)}px rgba(0,0,0,${GRADE.vig})`;g.style.background=`linear-gradient(180deg,rgba(4,8,10,.10),transparent 35%,rgba(3,6,8,.14))`+(GRADE.warm>0?`,radial-gradient(640px 420px at 66% 28%,rgba(255,196,96,${(GRADE.warm*.20).toFixed(3)}),transparent 72%)`:'')} // 暗角+暖色光池（黄山金色光池观感）
// 路线渲染路径：默认 MapLibre 原生线图层（geojson 弧长切片 setData 生长，地形绑定=定义上零漂移——SVG overlay 手算投影海拔插值 vs terrain mesh 错位，相机一动线在坡上滑=「漂移」判死×3）；routelayer=0 纯 SVG（锁机位项目）
// 单管线铁律（2026-09-10 主人「没有什么双轨」判死）：一切贴地元素（线/icon/tag/卡/点亮/pulse）全在 GL 层由引擎投影+引擎遮挡剔除——对齐与同隐同现由引擎保证；DOM 只剩屏幕固定 HUD/标题/图例；双轨（GL 线+SVG 垫底）=两轨不一致=向观众直播飘
const RLAY=qnum('routelayer',G0.routelayer??1); // 项目级走 map.grade.routelayer：0=纯 SVG（锁机位总览/信息图用它——原生线图层贴地会被山脊真实遮挡，高空俯瞰路线断成碎片判例；锁机位无相机运动=SVG 漂移判例不成立）；1=GL 单管线（跟拍默认）
const pfix=qnum('pfix',-1);
const godcam=qnum('godcam',0); // 调试探针：fitCam 俯视图（遮挡排查，用完即撤）
const GLSYM=qnum('glsym',1); // GL 符号层（icon/tag/点亮/pulse 全贴地）；0=DOM 旧路径回退
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x),fade=(t,a,b)=>ease((t-a)/(b-a));
const lengths=coords=>{const a=[0];for(let i=1;i<coords.length;i++){const lat=(coords[i][1]+coords[i-1][1])/2*Math.PI/180;a.push(a[i-1]+Math.hypot((coords[i][0]-coords[i-1][0])*111320*Math.cos(lat),(coords[i][1]-coords[i-1][1])*110574))}return a};
const SEGLEN={},SEGM={};for(const s of C.segments){SEGLEN[s.id]=lengths(s.coordinates);SEGM[s.id]=SEGLEN[s.id].at(-1)}
const pointAt=(coords,lens,p)=>{const d=Math.max(0,Math.min(1,p))*lens.at(-1);let i=1;while(i<lens.length&&lens[i]<d)i++;if(i>=lens.length)return coords.at(-1);const q=(d-lens[i-1])/(lens[i]-lens[i-1]||1);return[coords[i-1][0]+(coords[i][0]-coords[i-1][0])*q,coords[i-1][1]+(coords[i][1]-coords[i-1][1])*q]};
const smoothPointAt=(coords,lens,p,r=.06)=>{const n=9;let x=0,y=0,w=0;for(let i=0;i<n;i++){const q=Math.max(0,Math.min(1,p+r*(i-(n-1)/2)/((n-1)/2))),weight=1-Math.abs(i-(n-1)/2)/(n/2),pt=pointAt(coords,lens,q);x+=pt[0]*weight;y+=pt[1]*weight;w+=weight}return[x/w,y/w]};
const edgeOf=color=>{const m=/^#(..)(..)(..)$/.exec(color);if(!m)return'#06261a';const f=v=>Math.round(parseInt(v,16)*.16).toString(16).padStart(2,'0');return'#'+f(m[1])+f(m[2])+f(m[3])};

// ---- 时间轴分期：route 事件为骨架，hold/summary/camera 覆盖其间 ----
const routes=EVENTS.filter(e=>e.type==='route').sort((a,b)=>a.start-b.start);
const holds=EVENTS.filter(e=>e.type==='hold');
const summaries=EVENTS.filter(e=>e.type==='summary');
const camEvents=EVENTS.filter(e=>e.type==='camera');
const firstRoute=routes[0]||null,lastRoute=routes.at(-1)||null;
const segOrder=routes.map(r=>r.segment);
// litthr（EP7 2026-09-22 总揽/推进双模式）：只认真正在线上的标记（段由 location 坐标串成，线上点 d≈0）；默认 1e9=旧行为。beat 分镜只有一条 leg，跨沟景点会投影到 leg 上被误判「走过」——off=true 摘除走过判定，保持小字在场
const LITTHR=qnum('litthr',1e9);
const NOJ=qnum('noj',0); // noj=1 总揽模式（EP7 2026-09-22 主人定位裁决：总揽=纯静态计划图，无车无旅人，路线事件只画线不驱动任何走过判定）
const litPts=EVENTS.filter(e=>e.type==='marker'&&LOCS[e.location]).map(e=>{const lc=LOCS[e.location].coordinates;let best=null; // 走过点亮（主人 2026-09-09）：journey 越过景点最近弧长位即永久点亮金点
  for(const sid of segOrder){const s=SEGS[sid],lens=SEGLEN[sid];for(let i=0;i<s.coordinates.length;i++){const c=s.coordinates[i],d=(c[0]-lc[0])*(c[0]-lc[0])+(c[1]-lc[1])*(c[1]-lc[1]);if(!best||d<best.d)best={d,seg:sid,q:lens[i]/lens.at(-1)}}}
  return best?{c:lc,seg:best.seg,q:best.q,off:best.d*111000*111000>LITTHR*LITTHR}:null}).filter(Boolean);
const journeyAt=NOJ?()=>null:(t=>{ // 旅人位置：route 事件内沿弧长走，事件间隙停在上次终点；NOJ=1 总揽模式（无车无旅人）
  for(const r of routes){if(t<r.start)break;const s=SEGS[r.segment],p=ease((t-r.start)/(r.end-r.start));if(t<=r.end)return{pos:pointAt(s.coordinates,SEGLEN[s.id],p),seg:r.segment,p,active:true};if(r===lastRoute||t<(routes[routes.indexOf(r)+1]||{start:1e9}).start)return{pos:s.coordinates.at(-1),seg:r.segment,p:1,active:false}}
  return null});
const stageAt=t=>{ // 当前相机分期
  const su=summaries.find(e=>t>=e.start&&t<=e.end);if(su)return{kind:'summary',ev:su};
  const ho=holds.find(e=>!e.camFollow&&t>=e.start&&t<=(e.end>e.start?e.end:DUR));if(ho)return{kind:'hold',ev:ho};
  const ro=routes.find(e=>t>=e.start&&t<=e.end);if(ro)return{kind:'route',ev:ro};
  const ce=camEvents.find(e=>t>=e.start&&t<=(e.end>e.start?e.end:DUR));if(ce)return{kind:'camera',ev:ce};
  return{kind:'idle',ev:null}};

// ---- 相机参数：分期闭式求值 + 跨界混合保证连续（不闪帧） ----
const LATF=Math.cos(M.center[1]*Math.PI/180);
const MAXNATIVEZ=15.2; // 卫星瓦片锁 z15 原生（serve.py 降采样供低级），超过即数字放大发虚
const ALTK=1.5*OUT.height/512*40075016.686; // 相机海拔=ALTK/2^zoom（transform 实测拟合，随输出高度缩放）
const zoomForAgl=(agl,g)=>Math.max(9.6,Math.min(MAXNATIVEZ,Math.log2(ALTK/(agl+g*TEX)))); // AGL 恒定驱动（视觉 AGL=对 TEX 放大后的地形）：elevation=0 语义下相机海拔=agl+g×TEX，不含 TEX 会把相机压进视觉山体 1.5 倍（t=26.7 贴山判例）
const GPROF={};for(const s of C.segments){if(s.groundProfile)GPROF[s.id]=s.groundProfile}
const groundAt=(segId,p,r=.08)=>{const g=GPROF[segId];if(!g)return null;const n=g.length;let acc=0,w=0; // 编译期地面剖面三角窗平滑（运行时 queryTerrainElevation 不可信判例）
  for(let i=0;i<9;i++){const q=Math.max(0,Math.min(1,p+r*(i-4)/4)),weight=1-Math.abs(i-4)/4.5;const f=q*(n-1),i0=Math.floor(f),i1=Math.min(n-1,i0+1),fr=f-i0,v0=g[i0]??g[i1],v1=g[i1]??v0;if(v0==null)continue;acc+=(v0+(v1-v0)*fr)*weight;w+=weight}
  return w>0?acc/w:null};
const autoZoom=segId=>{const m=SEGM[segId]||2000;const z=Math.log2(156543.03392*LATF*OUT.height*.5/Math.max(m,60));return Math.max(9.6,Math.min(MAXNATIVEZ,z))}; // 回退用（无 agl/无 dem 项目）
const bearingAt=(segId,p,r=.08)=>{const s=SEGS[segId],lens=SEGLEN[segId]; // 切线方位（0=北顺时针）：相机始终从路线后方看前方=bearing 固定被山体挤到背后挡视野判例（t=26.7 贴坡）
  const a=pointAt(s.coordinates,lens,Math.max(0,p-r)),b=pointAt(s.coordinates,lens,Math.min(1,p+r));
  const dLon=(b[0]-a[0])*111320*Math.cos((a[1]+b[1])/2*Math.PI/180),dLat=(b[1]-a[1])*110574;
  return Math.atan2(dLon,dLat)*180/Math.PI};
const lerpAngle=(a,b,q)=>{let d=b-a;while(d>180)d-=360;while(d<-180)d+=360;return a+d*q}; // bearing 混合走最短弧（179→-179 不绕 358°）
const routeZoomSmooth=(segId,p)=>{const agl=(SEGS[segId]||{}).agl;const g=groundAt(segId,p,.35); // 大窗平滑（35% 弧长≈数 km）：只跟地面大趋势补偿 AGL，高频起伏留给自然透视；r=.08 小窗=zoom 高频波动呼吸感、段内常数=地面急降段上下涌（cable-down ±12% 判例），大窗是两头的正解

  if(C.storyboard.title){const out=Math.min(2.4,firstRoute?firstRoute.start:2.4);let op=fade(t,.3,1.1)*(1-fade(t,out,out+.5));const su=summaries.find(e=>t>=e.start&&t<=e.end);if(su)op=Math.max(op,fade(t,su.start,su.start+.6));if(C.storyboard.titleHold)op=fade(t,.3,1.0);titleEl.style.opacity=op} // 标题开场亮相+summary 期回亮常驻（EP7 判例：终态「一图」=封面级收藏锚，核心画面必须带标题）；titleHold=一图型 2D 攻略地图全程常驻
};
window.__qaOverlays=()=>{const out=[];const push=(kind,el,visEl)=>{const o=parseFloat(getComputedStyle(visEl||el).opacity||0);if(o>.05){const r=el.getBoundingClientRect();if(r.width>1&&r.height>1)out.push({kind,text:(el.textContent||'').slice(0,40),rect:{x:r.x,y:r.y,w:r.width,h:r.height},opacity:o})}};
  push('title',titleEl);push('hud',document.querySelector('#hud'));for(const k in tags)push('tag',tags[k].el);for(const k in calls)push('card',calls[k].el.querySelector('.card'),calls[k].el);legend.querySelectorAll('.pill').forEach(e=>push('pill',e));return out};
let timer;map.on('idle',()=>{clearTimeout(timer);timer=setTimeout(()=>window.__IDLE=true,100)});map.on('movestart',()=>window.__IDLE=false);map.on('error',e=>window.__ERR=(window.__ERR||'')+';'+(e.error?.message||e));
})();
</script></body></html>
